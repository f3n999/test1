<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #4CAF50;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        a {
            color: #2196F3;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            background-color: #fff;
            border: 2px solid #2196F3;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        a:hover {
            background-color: #2196F3;
            color: #fff;
        }
    </style>
</head>

<body>
    <h1>Example</h1>
    <p>Test</p>
    <a href="https://f3n999.github.io/portfolio/">Visitez mon site</a>
    azz
</body>

</html>
